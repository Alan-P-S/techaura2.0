<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TECHNOVA 2026 | Tech Fest</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:none;
}

body{
    font-family:Poppins, sans-serif;
    background:radial-gradient(circle at top,#0f2027,#000);
    color:#fff;
    overflow-x:hidden;
}

/* CYBER CURSOR */
.cursor{
    position:fixed;
    width:20px;
    height:20px;
    border:2px solid cyan;
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
    transition:0.05s;
    z-index:999;
}
.cursor::after{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    background:cyan;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* GRID BACKGROUND */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:
    linear-gradient(rgba(0,255,255,0.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,0.07) 1px,transparent 1px);
    background-size:60px 60px;
    animation:gridMove 25s linear infinite;
    z-index:-1;
}
@keyframes gridMove{
    from{transform:translate(0,0)}
    to{transform:translate(-60px,-60px)}
}

/* HERO */
header{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    perspective:1000px;
}

.glitch{
    font-family:Orbitron;
    font-size:4.2rem;
    color:cyan;
    position:relative;
    text-shadow:0 0 30px cyan;
}
.glitch::before,.glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;
}
.glitch::before{
    top:-2px;
    color:#ff00ff;
    clip-path:inset(0 0 80% 0);
    animation:glitch 2s infinite;
}
.glitch::after{
    top:2px;
    color:#00ffea;
    clip-path:inset(50% 0 0 0);
    animation:glitch 1.5s infinite;
}
@keyframes glitch{
    0%{clip-path:inset(0 0 90% 0)}
    50%{clip-path:inset(40% 0 40% 0)}
    100%{clip-path:inset(80% 0 0 0)}
}

.subtitle{
    margin-top:20px;
    font-size:1.3rem;
    color:#9ff;
    height:30px;
}

/* BUTTON */
.btn{
    margin-top:40px;
    padding:16px 45px;
    border:2px solid cyan;
    background:transparent;
    color:cyan;
    letter-spacing:2px;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,255,255,0.6);
}
.btn:hover{
    background:cyan;
    color:#000;
    box-shadow:0 0 50px cyan;
}

/* SECTIONS */
section{
    padding:100px 10%;
}
h2{
    text-align:center;
    font-family:Orbitron;
    color:cyan;
    margin-bottom:50px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}
.card{
    background:rgba(0,255,255,0.05);
    border:1px solid rgba(0,255,255,0.3);
    padding:30px;
    border-radius:15px;
    backdrop-filter:blur(15px);
    transform:translateY(40px);
    opacity:0;
    transition:0.6s;
}
.card.show{
    transform:translateY(0);
    opacity:1;
}
.card:hover{
    box-shadow:0 0 40px cyan;
}
.card h3{
    font-family:Orbitron;
    color:cyan;
    margin-bottom:10px;
}

/* PARTICLES */
.particle{
    position:fixed;
    width:3px;
    height:3px;
    background:cyan;
    border-radius:50%;
    animation:float linear infinite;
    opacity:0.7;
}
@keyframes float{
    from{transform:translateY(100vh)}
    to{transform:translateY(-10vh)}
}

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid rgba(0,255,255,0.3);
    color:#7ff;
}
</style>
</head>

<body>

<div class="cursor"></div>

<header id="hero">
    <h1 class="glitch" data-text="TECHNOVA 2026">TECHNOVA 2026</h1>
    <div class="subtitle" id="typing"></div>
    <button class="btn" id="soundBtn">ENTER THE FUTURE</button>
</header>

<section>
<h2>EVENT DOMAINS</h2>
<div class="cards">
    <div class="card"><h3>AI & Robotics</h3><p>Build intelligent machines.</p></div>
    <div class="card"><h3>Cyber Security</h3><p>Defend and exploit systems.</p></div>
    <div class="card"><h3>Game Development</h3><p>Create immersive digital worlds.</p></div>
    <div class="card"><h3>Hackathon</h3><p>24-hour innovation challenge.</p></div>
</div>
</section>

<footer>
© 2026 TECHNOVA | FUTURE ENGINEERED
</footer>

<script>
// CURSOR
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",e=>{
    cursor.style.left=e.clientX+"px";
    cursor.style.top=e.clientY+"px";
});

// PARALLAX HERO
document.addEventListener("mousemove",e=>{
    const hero=document.getElementById("hero");
    hero.style.transform=`rotateY(${e.clientX/50}deg) rotateX(${-e.clientY/50}deg)`;
});

// TYPING EFFECT
const text="Innovate • Code • Create • Dominate";
let i=0;
(function type(){
    if(i<text.length){
        typing.innerHTML+=text.charAt(i++);
        setTimeout(type,80);
    }
})();

// PARTICLES
for(let i=0;i<60;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=5+Math.random()*10+"s";
    document.body.appendChild(p);
}

// SCROLL REVEAL
const cards=document.querySelectorAll(".card");
window.addEventListener("scroll",()=>{
    cards.forEach(c=>{
        if(c.getBoundingClientRect().top<window.innerHeight-50){
            c.classList.add("show");
        }
    });
});

// SOUND FX
const audio=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=");
soundBtn.addEventListener("mouseenter",()=>audio.play());
</script>

</body>
</html>
