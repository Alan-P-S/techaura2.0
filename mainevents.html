<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TECHNOVA 2026 | Events</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: Poppins, sans-serif;
            background: radial-gradient(circle at top, #0f2027, #000);
            color: #fff;
            overflow-x: hidden;
        }

        /* GRID */
        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background:
                linear-gradient(rgba(0, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 25s linear infinite;
            z-index: -1;
        }

        @keyframes gridMove {
            to {
                transform: translate(-60px, -60px)
            }
        }

        /* HEADER */
        header {
            padding: 90px 10% 40px;
            text-align: center;
        }

        header h1 {
            font-family: Orbitron;
            font-size: 3.5rem;
            color: #00ffff;
            text-shadow: 0 0 25px #00ffff;
        }

        header p {
            color: #9ff;
            letter-spacing: 2px
        }

        /* EVENTS GRID */
        .events {
            padding: 80px 10%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
        }

        /* CARD */
        .card {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.35);
            border-radius: 18px;
            overflow: hidden;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            transform: translateY(40px);
            opacity: 0;
            transition: .6s;
        }

        .card.show {
            transform: none;
            opacity: 1;
        }

        .card:hover {
            box-shadow: 0 0 50px #00ffff;
        }

        /* POSTER */
        .poster {
            height: 400px;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(0, 255, 255, 0.4);
            background: linear-gradient(135deg, #001a1a, #003333, #001a1a);
        }

        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .6s;

        }

        .card:hover .poster img {
            transform: scale(1.1);
        }

        /* SCAN LINE */
        .poster::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                    transparent,
                    rgba(0, 255, 255, .25),
                    transparent);
            animation: scan 2.5s infinite;
        }

        @keyframes scan {
            from {
                transform: translateY(-100%)
            }

            to {
                transform: translateY(100%)
            }
        }

        /* BADGE */
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #00ffff;
            color: #000;
            padding: 5px 12px;
            font-size: .7rem;
            font-family: Orbitron;
            letter-spacing: 1px;
            box-shadow: 0 0 15px #00ffff;
        }

        /* CONTENT */
        .content {
            padding: 28px
        }

        .card h3 {
            font-family: Orbitron;
            color: #00ffff;
        }

        .meta {
            margin: 10px 0;
            font-size: .85rem;
            color: #9ff;
        }

        .card p {
            color: #bff;
            margin-bottom: 20px;
        }

        /* BUTTON */
        .btn {
            padding: 12px 32px;
            border: 2px solid #00ffff;
            background: transparent;
            color: #00ffff;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, .6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 15px #00ffff
            }

            50% {
                box-shadow: 0 0 35px #00ffff
            }

            100% {
                box-shadow: 0 0 15px #00ffff
            }
        }

        .btn:hover {
            background: #00ffff;
            color: #000;
        }

        /* MODAL */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal-box {
            background: #050505;
            padding: 40px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 50px #00ffff;
            width: 90%;
            max-width: 420px;
            border-radius: 14px;
        }

        .modal-box h2 {
            font-family: Orbitron;
            color: #00ffff;
        }

        .modal-box input {
            width: 100%;
            margin: 15px 0;
            padding: 10px;
            background: #000;
            border: 1px solid #00ffff;
            color: #fff;
        }

        .close {
            text-align: center;
            margin-top: 15px;
            cursor: pointer;
            color: #9ff;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid rgba(0, 255, 255, .3);
            color: #7ff;
        }
    </style>
</head>

<body>

    <header>
        <h1>MAIN EVENTS</h1>
        <p>SELECT YOUR EVENT</p>
    </header>

    <section class="events">

        <div class="card">
            <div class="poster">
                <!-- <div class="badge">LIVE</div> -->
                <img src="posters/projectexpo.jpeg">
            </div>
            <div class="content">
                <h3>PROJECT EXPO</h3>
                <div class="meta">📅 16 JAN | REG FEE : 250RS(TEAM)</div>
                <p>🚀 Your project is not just an exhibit, it’s your vision.”.</p>
                <a href="projectexpo.html"><button class="btn">Explore</button></a>
            </div>
        </div>

        <div class="card">
            <div class="poster">
                <!-- <div class="badge">LIVE</div> -->
                <img src="posters/hackathon.jpeg">
            </div>
            <div class="content">
                <h3>HACKATHON</h3>
                <div class="meta">📅 15 JAN | REG FEE : 200RS(TEAM)</div>
                <p>Innovate.Code.Create.”.</p>
                <a href="hackathon.html"><button class="btn">Explore</button></a>
            </div>
        </div>

       
    </section>

    <footer>
        © 2026 TECH AURA 2.0 | Innovate • Engineer • Create • Lead
    </footer>

    <!-- MODAL -->
    <div id="modal">
        <div class="modal-box">
            <h2 id="eventName"></h2>
            <input placeholder="Full Name">
            <input placeholder="College Name">
            <input placeholder="Email Address">
            <button class="btn">SUBMIT</button>
            <div class="close" onclick="closeModal()">CANCEL</div>
        </div>
    </div>

    <script>
        /* MODAL */
        function openModal(e) {
            modal.style.display = "flex";
            eventName.innerText = e + " REGISTRATION";
        }
        function closeModal() {
            modal.style.display = "none";
        }

        /* SCROLL REVEAL */
        const cards = document.querySelectorAll(".card");
        window.addEventListener("scroll", () => {
            cards.forEach(c => {
                if (c.getBoundingClientRect().top < innerHeight - 50)
                    c.classList.add("show");
            });
        });
    </script>

</body>

</html>
