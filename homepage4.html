<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TECHNOVA 2026 | NATIONAL TECH FEST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;cursor:none}
html{scroll-behavior:smooth}
body{
    font-family:Poppins,sans-serif;
    background:#000;
    color:#fff;
    overflow-x:hidden;
}

/* ================= LOADER ================= */
#loader{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
#bar{
    width:300px;height:6px;
    border:1px solid cyan;
    margin-top:20px;
}
#fill{
    height:100%;
    width:0%;
    background:cyan;
    animation:load 2s forwards;
}
@keyframes load{to{width:100%}}

/* ================= CURSOR ================= */
.cursor{
    position:fixed;
    width:22px;height:22px;
    border:2px solid cyan;
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:999;
}
.cursor::after{
    content:"";
    width:6px;height:6px;
    background:cyan;
    border-radius:50%;
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
}

/* ================= NAVBAR ================= */
nav{
    position:fixed;
    top:0;left:0;
    width:100%;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,0.5);
    border-bottom:1px solid rgba(0,255,255,0.3);
    z-index:1000;
}
nav h1{
    font-family:Orbitron;
    color:cyan;
}
nav a{
    margin-left:25px;
    color:#9ff;
    text-decoration:none;
    position:relative;
}
nav a::after{
    content:"";
    position:absolute;
    left:0;bottom:-5px;
    width:0;height:2px;
    background:cyan;
    transition:.3s;
}
nav a:hover::after{width:100%}

/* ================= BACKGROUND GRID ================= */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:
    linear-gradient(rgba(0,255,255,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,0.05) 1px,transparent 1px);
    background-size:60px 60px;
    animation:grid 30s linear infinite;
    z-index:-1;
}
@keyframes grid{to{transform:translate(-60px,-60px)}}

/* ================= HERO ================= */
header{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    perspective:1200px;
}

/* HOLOGRAM */
.core{
    width:130px;height:130px;
    border:2px solid cyan;
    border-radius:50%;
    box-shadow:0 0 40px cyan;
    animation:spin 8s linear infinite;
    margin-bottom:30px;
}
@keyframes spin{to{transform:rotateY(360deg) rotateX(360deg)}}

/* GLITCH */
.glitch{
    font-family:Orbitron;
    font-size:4rem;
    color:cyan;
    text-shadow:0 0 30px cyan;
    position:relative;
}
.glitch::before,.glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;
}
.glitch::before{top:-2px;color:#f0f;animation:glitch 2s infinite}
.glitch::after{top:2px;color:#0ff;animation:glitch 1.5s infinite}
@keyframes glitch{
    0%{clip-path:inset(0 0 80% 0)}
    50%{clip-path:inset(40% 0 40% 0)}
    100%{clip-path:inset(80% 0 0 0)}
}

.subtitle{margin:20px;color:#9ff;height:30px}

/* BUTTON */
.btn{
    margin-top:35px;
    padding:16px 45px;
    border:2px solid cyan;
    background:transparent;
    color:cyan;
    letter-spacing:2px;
    box-shadow:0 0 25px cyan;
    transition:.3s;
}
.btn:hover{
    background:cyan;
    color:#000;
    box-shadow:0 0 60px cyan;
}

/* ================= SECTIONS ================= */
section{padding:120px 10%}
h2{
    font-family:Orbitron;
    text-align:center;
    color:cyan;
    margin-bottom:60px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}
.card{
    background:rgba(0,255,255,0.05);
    border:1px solid rgba(0,255,255,0.3);
    padding:30px;
    border-radius:15px;
    backdrop-filter:blur(12px);
    opacity:0;
    transform:translateY(40px);
    transition:.7s;
}
.card.show{opacity:1;transform:none}
.card:hover{box-shadow:0 0 40px cyan}
.card h3{font-family:Orbitron;color:cyan}

/* ================= MODAL ================= */
#modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}
.modal-box{
    background:#050505;
    padding:40px;
    border:1px solid cyan;
    box-shadow:0 0 50px cyan;
    width:90%;
    max-width:400px;
}
.modal-box input{
    width:100%;
    margin:10px 0;
    padding:10px;
    background:#000;
    border:1px solid cyan;
    color:#fff;
}

/* ================= FOOTER ================= */
footer{
    padding:30px;
    text-align:center;
    border-top:1px solid rgba(0,255,255,0.3);
    color:#7ff;
}

/* PARTICLES CANVAS */
canvas{
    position:fixed;
    inset:0;
    z-index:-2;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
    <div style="font-family:Orbitron;color:cyan">BOOTING TECHNOVA...</div>
    <div id="bar"><div id="fill"></div></div>
</div>

<canvas id="space"></canvas>
<div class="cursor"></div>

<nav>
    <h1>TECHNOVA</h1>
    <div>
        <a href="#hero">Home</a>
        <a href="#events">Events</a>
        <a href="#register">Register</a>
    </div>
</nav>

<header id="hero">
    <div class="core"></div>
    <h1 class="glitch" data-text="TECHNOVA 2026">TECHNOVA 2026</h1>
    <div class="subtitle" id="typing"></div>
    <button class="btn" onclick="openModal()">REGISTER NOW</button>
</header>

<section id="events">
<h2>EVENT DOMAINS</h2>
<div class="cards">
    <div class="card"><h3>AI & Robotics</h3><p>Machines of tomorrow.</p></div>
    <div class="card"><h3>Cyber Security</h3><p>Hack. Defend. Secure.</p></div>
    <div class="card"><h3>Game Development</h3><p>Immersive worlds.</p></div>
    <div class="card"><h3>Hackathon</h3><p>24-hour innovation.</p></div>
</div>
</section>

<footer id="register">
© 2026 TECHNOVA | NATIONAL LEVEL TECH FEST
</footer>

<!-- MODAL -->
<div id="modal">
<div class="modal-box">
<h3 style="color:cyan;font-family:Orbitron">REGISTER</h3>
<input placeholder="Name">
<input placeholder="College">
<input placeholder="Email">
<button class="btn" onclick="closeModal()">SUBMIT</button>
</div>
</div>

<script>
/* LOADER */
setTimeout(()=>loader.style.display="none",2000)

/* CURSOR */
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",e=>{
    cursor.style.left=e.clientX+"px";
    cursor.style.top=e.clientY+"px";
});

/* PARALLAX */
document.addEventListener("mousemove",e=>{
    hero.style.transform=`rotateY(${e.clientX/70}deg) rotateX(${-e.clientY/70}deg)`
});

/* TYPING */
const text="Innovate • Code • Create • Dominate";
let i=0;
(function type(){
    if(i<text.length){
        typing.innerHTML+=text[i++];
        setTimeout(type,80);
    }
})();

/* SCROLL REVEAL */
const cards=document.querySelectorAll(".card");
window.addEventListener("scroll",()=>{
    cards.forEach(c=>{
        if(c.getBoundingClientRect().top<innerHeight-50)
            c.classList.add("show");
    });
});

/* MODAL */
function openModal(){modal.style.display="flex"}
function closeModal(){modal.style.display="none"}

/* GALAXY CANVAS */
const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;canvas.height=innerHeight;
let stars=[...Array(150)].map(()=>({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2
}));
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="cyan";
    stars.forEach(s=>{
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
        s.y+=0.3;
        if(s.y>canvas.height) s.y=0;
    });
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
